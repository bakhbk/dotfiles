# ===== История / индексы =====
set -g history-limit 20000
set -g base-index 1
set -g pane-base-index 1

# ===== Мышь =====
set -g mouse on

# ===== Keys =====
set -g mode-keys vi
set -g extended-keys on
set -g extended-keys-format csi-u

# ===== Clipboard: OSC 52 (главное) =====
# tmux сам отправляет OSC 52 в терминал при любом копировании, если терминал
# поддерживает его (Ghostty/iTerm2/Alacritty/WezTerm/kitty). Это работает и
# через SSH, без pbcopy/xclip на сервере.
set -g set-clipboard on

# Страховка: если terminfo-запись терминала отсутствует на сервере
# (TERM=xterm-ghostty не установлен) — объявляем возможность вручную.
set -g terminal-features "xterm-ghostty:clipboard,xterm-256color:clipboard,tmux:clipboard"

# ===== Префикс =====
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ===== Copy mode =====
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X rectangle-toggle

# y / мышь — штатный путь через OSC 52
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# Y — явный OSC 52 (на случай, если set-clipboard не сработал в этом терминале)
bind -T copy-mode-vi Y send -X copy-pipe-and-cancel \
    "printf '\033]52;c;%s\a' \"$(base64 | tr -d '\n')\""

# Локальный fallback: только если tmux запущен на той же машине, что и
# терминал, и в терминале нет OSC 52 (например, Terminal.app на macOS).
if-shell "uname | grep -q Darwin" {
  set -g @copy_cmd "pbcopy"
}
if-shell "uname | grep -q Linux" {
  set -g @copy_cmd "cat > /dev/null"
  if-shell "command -v wl-copy >/dev/null 2>&1" 'set -g @copy_cmd "wl-copy"'
  if-shell "command -v xclip >/dev/null 2>&1" 'set -g @copy_cmd "xclip -sel clip -i"'
  if-shell "command -v xsel >/dev/null 2>&1" 'set -g @copy_cmd "xsel -b -i"'
}
# B — копировать в системный буфер "вручную" (без OSC 52)
bind -T copy-mode-vi B send -X copy-pipe-and-cancel "#{@copy_cmd}"

# ===== Окна/панели =====
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind & kill-window
bind x kill-pane

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5
